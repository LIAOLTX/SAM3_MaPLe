# SAM3 PLE Training Configuration
# Full PLE configuration - applies PLE to ALL transformer components
# Use this for maximum adaptation capacity (more trainable parameters)

# Model settings
model:
  name: "facebook/sam3"
  cache_dir: null
  load_from_HF: false
  checkpoint_path: facebook/sam3/sam3.pt

# Training settings
training:
  data_dir: datasets/COD10K-example  # Root directory containing train/valid/test folders with COCO annotations
  batch_size: 4      # Increased from 1 to reduce gradient variance
  num_workers: 2        # Increase for better data loading

  learning_rate: 1e-3        # Increased from 1e-5 (SAM3 uses 1e-4 to 5e-4 for fine-tuning)
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0

  num_epochs: 20       # Reduced from 500 (small dataset overfits quickly)
  warmup_steps: 200     # Reduced from 1000 (proportional to dataset size)
  lr_scheduler: "cosine"

  logging_steps: 10
  eval_steps: 1       # More frequent validation (from 500)
  save_steps: 100       # More frequent checkpoints (from 1000)
  save_total_limit: 5   # Keep more checkpoints

  mixed_precision: "bf16"    # Use bfloat16 if available
  seed: 42
  gradient_accumulation_steps: 8  # Reduced from 16 (effective batch: 2×8=16)

output:
  output_dir: "outputs/sam3_maple"
  logging_dir: "logs"
  push_to_hub: false
  hub_model_id: null

evaluation:
  metric: "iou"
  save_predictions: false
  compute_metrics_during_training: true

hardware:
  device: "cuda"
  dataloader_pin_memory: true
  use_compile: false

MaPLe:
  prefix:
    prompt: An inconspicuous
    tuning: true
  suffix:
    prompt: moth
    tuning: true